name: assignment_solver_app
description: "AI-powered assignment solver with Flutter and Django backend"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Secure Storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # File Picker
  file_picker: ^10.3.3

  # Path Provider
  path_provider: ^2.1.4

  # Permission Handler
  permission_handler: ^12.0.1

  # Theming (FlexColorScheme)
  flex_color_scheme: ^8.3.1

  # Fonts
  google_fonts: ^6.2.1

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.1

  # Icons
  iconsax: ^0.0.8
  url_launcher: ^6.3.1
  app_links: ^6.4.1
  open_file: ^3.5.0
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  flutter_svg:
  check_disposable_email: ^0.0.1
  awesome_snackbar_content: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# === LAUNCHER ICON CONFIGURATION ===
flutter_launcher_icons:
  # === Build settings ===
  android: true # Build for Android
  ios: false # Skip iOS

  # === Legacy Android Icon (Android 7.1 and older) ===
  image_path: "assets/icon/icon_main.png"

  # === Modern Android (Adaptive Icons, Android 8.0+) ===
  adaptive_icon_background: "#F65100" # Your primaryColor
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
